services:
  - type: web
    name: hospital-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: Jwt__Key
        value: ThisIsASecretKeyForMedicalSystem2026!@#
      - key: Jwt__Issuer
        value: HospitalApi
      - key: Jwt__Audience
        value: HospitalUsers

databases:
  - name: hospital-db
    plan: free
    databaseName: hospitaldb
